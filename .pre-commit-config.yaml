repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatting
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: Python types
        entry: python -m pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: offline-tests
        name: Offline regression tests
        entry: python -m tools.test_offline
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-build
        name: Frontend types and build
        entry: npm --prefix frontend run build
        language: system
        pass_filenames: false
        files: ^frontend/
